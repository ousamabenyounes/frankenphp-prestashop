name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate skeleton
        run: ./scripts/validate-skeleton.sh

      - name: Test Caddy routing
        run: ./tests/caddy-routing.sh

      - name: Test benchmark status guard
        run: ./tests/bench-url-status.sh

      - name: Validate Nginx baseline config
        run: docker compose --env-file .env.example -f compose.nginx.yaml config >/dev/null

      - name: Verify PrestaShop distribution URL
        run: curl -fLI --retry 3 --retry-delay 2 "https://github.com/PrestaShopCorp/prestashop-classic/releases/download/9.1.4-5.0/prestashop_9.1.4-5.0.zip"
