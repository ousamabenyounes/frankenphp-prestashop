server {
    listen 80;
    server_name _;
    root /app;
    index index.php;

    location = /healthz {
        return 204;
    }

    location ~ /\.(?:env|git|svn|hg) {
        return 404;
    }

    location ~* ^/(?:app|bin|cache|classes|config|docs|download|localization|override|src|tests|tools|translations|var|vendor)/ {
        return 404;
    }

    location ~* \.(?:sql|sqlite|sqlite3|log|md|dist|ini|sh|ya?ml)$ {
        return 404;
    }

    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|json|map|otf|png|svg|ttf|webmanifest|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(?:csv|xml|zip|gz)$ {
        add_header Cache-Control "no-store";
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_MOD_REWRITE On;
    }
}
